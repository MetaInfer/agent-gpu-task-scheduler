[project]
name = "agent-gpu-task-scheduler"
version = "0.2.0"
description = "Claude-driven GPU task scheduler MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "cryptography>=42,<46",
  "rfc8785>=0.1,<1",
  "httpx>=0.27,<1",
  "websockets>=12,<16",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.scripts]
agent-scheduler = "agent_scheduler.cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "real_claude: requires an explicitly provisioned Claude Code CLI",
  "real_gpu: requires Docker, hy-smi, and an authorized GPU profile",
  "real_codex: requires an authenticated Codex CLI",
  "real_pi: requires an authenticated pi CLI with pi-mcp-adapter installed",
  "real_dsh: requires an authenticated dsh with dsh-mcp-bridge installed",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agent_scheduler"]
